name: zalo-invest-bot

on:
  workflow_dispatch:  # cho phép chạy tay để test
  schedule:
    - cron: "0 1 * * 1-5"   # 08:00 VN - Điểm tin tổng hợp
    - cron: "0 5 * * 1-5"   # 12:00 VN - Hỗ trợ giao dịch
    - cron: "0 7 * * 1-5"   # 14:00 VN - Thông tin sự kiện
    - cron: "0 8 * * 1-5"   # 15:00 VN - Hỗ trợ giao dịch

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài thư viện
        run: pip install -r requirements.txt

      - name: Chạy đúng nhiệm vụ theo lịch (hoặc chạy tay chọn qua workflow_dispatch input)
        env:
          ZALO_BOT_TOKEN: ${{ secrets.ZALO_BOT_TOKEN }}
          ZALO_CHAT_ID: ${{ secrets.ZALO_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          case "${{ github.event.schedule }}" in
            "0 1 * * 1-5") python -m tasks.news_digest ;;
            "0 5 * * 1-5") python -m tasks.support_trading ;;
            "0 7 * * 1-5") python -m tasks.corporate_events ;;
            "0 8 * * 1-5") python -m tasks.support_trading ;;
            *) echo "Chạy tay (workflow_dispatch): mặc định chạy cả 3" 
               python -m tasks.news_digest
               python -m tasks.support_trading
               python -m tasks.corporate_events ;;
          esac

      - name: Commit lại state file (nếu có thay đổi)
        run: |
          git config user.name "zalo-invest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/*.json || true
          git diff --cached --quiet || git commit -m "chore: cập nhật state file [skip ci]"
          git push || true
